name: Live acceptance

# Real Ollama + model probe. CI mocks every backend, so this is the only check that
# catches upstream Ollama regressions; provisioning installs the latest Ollama release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama vision model to probe
        default: qwen3.5:2b

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
      - name: Install isolated runtime
        run: uv run local-vision --home "$RUNNER_TEMP/local-vision" install --root "$GITHUB_WORKSPACE"
      - name: Provision Ollama and probe the model
        run: >-
          uv run python scripts/live_acceptance.py
          --home "$RUNNER_TEMP/local-vision"
          --model "${{ inputs.model || 'qwen3.5:2b' }}"
          --output "$RUNNER_TEMP/live-acceptance.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance
          path: ${{ runner.temp }}/live-acceptance.json
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - run: uv sync --locked --extra dev --extra bench
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - name: Diagnose macOS startup (temporary)
        if: runner.os == 'macOS'
        run: |
          uv run python - <<'EOF'
          import socket, sys, time, sysconfig
          print(sys.executable, sys.version, sysconfig.get_config_var("prefix"))
          for host in ("127.0.0.1", "localhost"):
              t = time.monotonic(); name = socket.getfqdn(host)
              print(f"getfqdn({host}) -> {name} in {time.monotonic() - t:.2f}s")
          from http.server import HTTPServer, BaseHTTPRequestHandler
          t = time.monotonic(); HTTPServer(("127.0.0.1", 0), BaseHTTPRequestHandler).server_close()
          print(f"HTTPServer bind in {time.monotonic() - t:.2f}s")
          import subprocess
          t = time.monotonic(); subprocess.run([sys.executable, "-c", "pass"], check=True)
          print(f"child interpreter in {time.monotonic() - t:.2f}s")
          t = time.monotonic(); import local_vision_mcp.server  # noqa
          print(f"import server in {time.monotonic() - t:.2f}s")
          EOF
      - run: uv run pytest -q --basetemp "$RUNNER_TEMP/pytest"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest/**/*.log
          if-no-files-found: ignore
      - name: Installed package acceptance
        run: uv run local-vision --home "$RUNNER_TEMP/local-vision" install --root "$GITHUB_WORKSPACE"
      - name: Bootstrap script acceptance
        run: python3 scripts/install.py --home "$RUNNER_TEMP/local-vision-bootstrap" install --root "$GITHUB_WORKSPACE"

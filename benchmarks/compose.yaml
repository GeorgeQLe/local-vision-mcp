# A dedicated backend: limits apply to inference, not merely the benchmark client.
services:
  ollama:
    image: ${BENCH_OLLAMA_IMAGE:-ollama/ollama:0.40.6}
    container_name: local-vision-bench-ollama
    ports:
      - "127.0.0.1:${BENCH_PORT:-11435}:11434"
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_RAM:-8g}
    memswap_limit: ${BENCH_RAM:-8g}
    pids_limit: 512
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: ${BENCH_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - models:/root/.ollama/models
volumes:
  models:
